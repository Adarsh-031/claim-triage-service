[project]
name = "triage-common"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7", "pydantic-settings>=2.3", "sqlalchemy>=2.0", "psycopg[binary]>=3.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["triage_common"]
