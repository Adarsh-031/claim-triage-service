reviews:
  # Only critical issues inline; everything else goes into ONE review summary
  profile: "quiet"

  # One walkthrough comment, collapsed, nothing written into the PR description
  high_level_summary: true
  high_level_summary_in_walkthrough: true
  collapse_walkthrough: true
  changed_files_summary: false
  sequence_diagrams: false
  estimate_code_review_effort: false
  related_issues: false
  related_prs: false
  suggested_labels: false
  suggested_reviewers: false
  poem: false
  in_progress_fortune: false
  review_status: false
  review_info: false
  enable_prompt_for_ai_agents: false

  auto_review:
    # Review only once, when the PR is marked ready, not on every push
    enabled: true
    drafts: false
    auto_incremental_review: false

  path_filters:
    - "!**/*.lock"
    - "!**/*.ipynb"
    - "!**/dist/**"

chat:
  auto_reply: false