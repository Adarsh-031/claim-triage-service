[project]
name = "claim-triage-service"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["triage-common", "triage-api", "triage-worker"]

[tool.uv.workspace]
members = ["libs/common", "services/api", "services/worker", "services/ingest"]

[tool.uv.sources]
triage-common = { workspace = true }
triage-api = { workspace = true }
triage-worker = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "locust>=2.31",
    "httpx>=0.28.1",
    "pyyaml>=6.0.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "SIM", "UP"]
