[project]
name = "triage-worker"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "triage-common",
  "redis>=5.0",
  "langgraph>=0.2",
  "httpx>=0.27",
  "prometheus-client>=0.20",
  "opentelemetry-sdk>=1.25",
  "opentelemetry-exporter-otlp>=1.25",
  "chromadb==1.5.3",
  "rank-bm25>=0.2.2",
  "langchain-core>=1.0",
]

[tool.uv.sources]
triage-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["worker"]
