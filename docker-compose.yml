name: claim-triage

x-app-env: &app-env
  env_file: .env

services:
  api:
    build: { context: ., dockerfile: services/api/Dockerfile }
    <<: *app-env
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      retries: 5

  worker:
    build: { context: ., dockerfile: services/worker/Dockerfile }
    <<: *app-env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      chroma: { condition: service_healthy }
      llm-stub: { condition: service_healthy }

  web:
    build: { context: ., dockerfile: services/web/Dockerfile }
    ports: ["3000:80"]
    depends_on: [api]

  redis:
    image: redis:7-alpine
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, retries: 10 }

  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: triage, POSTGRES_PASSWORD: triage, POSTGRES_DB: triage }
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U triage"], interval: 5s, retries: 10 }

  chroma:
    image: chromadb/chroma:1.5.3
    volumes: [chroma:/data]
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8000 || exit 1; printf 'GET /api/v2/heartbeat HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; IFS= read -r -t 3 response <&3; [[ \"$$response\" == *\"200 OK\"* ]]"]
      interval: 10s
      timeout: 5s
      retries: 10

  llm-stub:
    build: { context: ., dockerfile: services/llm-stub/Dockerfile }
    environment:
      STUB_DELAY: ${STUB_DELAY:-1.5}
    ports: ["8001:8001"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8001/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 10

  jaeger:
    image: jaegertracing/all-in-one:1.60
    ports: ["16686:16686"]

  prometheus:
    image: prom/prometheus:v2.54.0
    volumes: ["./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:11.2.0
    ports: ["3001:3000"]
    volumes: ["./deploy/grafana/provisioning:/etc/grafana/provisioning:ro"]

volumes:
  pgdata:
  chroma:
