name: claim-triage

x-app-env: &app-env
  env_file: .env

services:
  api:
    build: { context: ., dockerfile: services/api/Dockerfile }
    <<: *app-env
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  worker:
    build: { context: ., dockerfile: services/worker/Dockerfile }
    <<: *app-env
    volumes:
      - ./corpus:/src/corpus:ro
    environment:
      CORPUS_DIR: ${CORPUS_DIR:-/src/corpus/processed}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      chroma: { condition: service_healthy }
      llm-stub: { condition: service_healthy }
      ingest: { condition: service_completed_successfully }
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import redis; from sqlalchemy import text; from triage_common.settings import settings; from triage_common.store import engine; redis.Redis.from_url(settings.redis_url).ping(); c=engine.connect(); c.execute(text('select 1')); c.close()"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build: { context: ., dockerfile: services/web/Dockerfile }
    ports: ["3000:80"]
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  redis:
    image: redis:7.4.7-alpine3.21
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  postgres:
    image: postgres:16.15-alpine3.24
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  ingest:
    build: { context: ., dockerfile: services/ingest/Dockerfile }
    <<: *app-env
    volumes:
      - ./corpus:/src/corpus
      - embedding_cache:/root/.cache/chroma
    depends_on:
      postgres: { condition: service_healthy }
      chroma: { condition: service_healthy }
    command: ["sh", "-c", "python scripts/fetch_corpus.py && python cli/ingest.py && python cli/index_corpus.py && python cli/index_corpus.py --verify"]
    restart: "no"

  chroma:
    image: chromadb/chroma:1.5.3
    volumes: [chroma:/data]
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8000 || exit 1; printf 'GET /api/v2/heartbeat HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; IFS= read -r -t 3 response <&3; [[ \"$$response\" == *\"200 OK\"* ]]"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  llm-stub:
    build: { context: ., dockerfile: services/llm-stub/Dockerfile }
    environment:
      STUB_DELAY: ${STUB_DELAY:-1.5}
    ports: ["8001:8001"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8001/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  jaeger:
    image: jaegertracing/all-in-one:1.60.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports: ["16686:16686"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:14269/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  prometheus:
    image: prom/prometheus:v2.54.0
    volumes: ["./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "/bin/busybox", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  grafana:
    image: grafana/grafana:11.2.0
    ports: ["3001:3000"]
    volumes: ["./deploy/grafana/provisioning:/etc/grafana/provisioning:ro"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
    depends_on:
      prometheus: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/api/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  pgdata:
  chroma:
  embedding_cache:
