global: { scrape_interval: 10s }
scrape_configs:
  - job_name: api
    static_configs: [{ targets: ["api:8000"] }]
  # DNS discovery follows every worker replica when Compose scales the service.
  - job_name: worker
    dns_sd_configs:
      - names: ["worker"]
        type: A
        port: 8002
        refresh_interval: 10s
  - job_name: verifier-worker
    dns_sd_configs:
      - names: ["verifier-worker"]
        type: A
        port: 8003
        refresh_interval: 10s
  # Container CPU/memory per Compose service (#33).
  - job_name: cadvisor
    static_configs: [{ targets: ["cadvisor:8080"] }]
  - job_name: prometheus
    static_configs: [{ targets: ["localhost:9090"] }]
